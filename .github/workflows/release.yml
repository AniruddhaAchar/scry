name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  self-contained-zips:
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish self-contained
        run: >
          dotnet publish src/Scry.Client/Scry.Client.csproj -c Release
          -r ${{ matrix.rid }} --self-contained -p:Version=${VERSION}
          -o publish/${{ matrix.rid }}
      - name: Zip
        run: cd publish/${{ matrix.rid }} && zip -r ../../scry-${VERSION}-${{ matrix.rid }}.zip .
      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a prerelease suffix (e.g. v0.0.1-rc.1) marks the Release as a prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: scry-${{ env.VERSION }}-${{ matrix.rid }}.zip
  tool-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack tool
        run: dotnet pack src/Scry.Client/Scry.Client.csproj -c Release -p:Version=${VERSION} -o nupkg
      # Publish to the GitHub Packages NuGet registry using the workflow's built-in
      # GITHUB_TOKEN — no long-lived API key to maintain or leak. Install with:
      #   dotnet tool install -g Scry.Cli \
      #     --add-source https://nuget.pkg.github.com/<owner>/index.json
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
