name: ci
# Runs the same pre-commit hooks we enforce locally (.pre-commit-config.yaml:
# dotnet format + unit tests) as the PR gate — no separate pipeline to keep in
# sync.
#
# Dependabot PRs are handled by dependabot-lockfiles.yml instead: under Central
# Package Management a bump leaves some packages.lock.json files stale, which
# would fail this job's restore. That workflow regenerates the lock files and
# runs these same hooks, so we skip Dependabot here to avoid a misleading red.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hooks:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      # The hooks are `language: system` and shell out to the .NET SDK, so it
      # must be on PATH before prek runs them.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      # prek is our hook runner (a fast pre-commit reimplementation); uvx fetches
      # and runs it without a separate install step.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          # No Python dependency files in this repo — skip the (never-hit) cache.
          enable-cache: false
      - name: Run pre-commit hooks
        run: uvx prek run --all-files
