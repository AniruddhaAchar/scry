syntax = "proto3";

package scry.v1;

option csharp_namespace = "Scry.Contracts.V1";

// The Scry analysis service. A scryd host serves exactly one loaded dump.
//
// M0 (skeleton) implements only Health and Shutdown — no ClrMD yet. The
// analysis RPCs (DumpHeap, DumpObject, ClrThreads, ...) are added in later
// milestones; see the v0.0.1 handoff §8/§10 for their shapes.
service Scry {
  // Liveness/readiness probe. Cheap; safe to poll while a host warms up.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Ask the host to dispose the runtime, release the dump file, and exit.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Walk managed thread stacks. thread_os_id == 0 (or all_threads) → every thread.
  rpc ClrStack(ClrStackRequest) returns (ClrStackResponse);

  // Heap statistics or a paged object listing (type_filter = case-sensitive substring; empty = all).
  rpc DumpHeap(DumpHeapRequest) returns (DumpHeapResponse);

  // Live exceptions on the heap (paged): address, type, message, HResult, inner chain.
  rpc DumpExceptions(DumpExceptionsRequest) returns (DumpExceptionsResponse);

  // Full detail for one exception object by address, including its reconstructed stack trace.
  rpc PrintException(PrintExceptionRequest) returns (PrintExceptionResponse);
}

message HealthRequest {}

message HealthResponse {
  enum State {
    LOADING = 0;  // dump load / DAC resolution in progress
    READY = 1;    // runtime open, accepting analysis commands
    FAILED = 2;   // load failed; detail explains why
  }
  State state = 1;
  string runtime_version = 2;  // CLR version once loaded; empty in M0
  string detail = 3;           // human/agent-readable status or error context
}

message ShutdownRequest {}

message ShutdownResponse {}

message ClrStackRequest {
  uint32 thread_os_id = 1;   // 0 = all threads
  bool   all_threads  = 2;   // explicit "all" even if a stray id is set
}

message ClrStackResponse {
  repeated ThreadStack threads = 1;
}

message ThreadStack {
  uint32 os_thread_id = 1;
  int32  managed_thread_id = 2;
  bool   is_alive = 3;
  repeated StackFrame frames = 4;
}

message StackFrame {
  string kind = 1;
  uint64 instruction_pointer = 2;
  uint64 stack_pointer = 3;
  string method = 4;
  string type = 5;
  string module = 6;
}

message DumpHeapRequest {
  string type_filter = 1;   // case-sensitive substring; empty = all types
  bool   stat = 2;          // true → per-type stats; false → object listing
  int32  limit = 3;         // object-listing page cap (<=0 → server default 1000)
  int32  offset = 4;
}

message DumpHeapResponse {
  repeated HeapTypeStat stats = 1;   // populated when stat=true
  repeated HeapObject objects = 2;   // populated when stat=false
  int64  total_matches = 3;          // object listing: total matched (pre-paging)
  bool   truncated = 4;
}

message HeapTypeStat { string type = 1; uint64 method_table = 2; int64 count = 3; uint64 total_size = 4; }

message HeapObject { uint64 address = 1; string type = 2; uint64 size = 3; }

message DumpExceptionsRequest { int32 limit = 1; int32 offset = 2; }

message DumpExceptionsResponse { repeated ExceptionInfo exceptions = 1; int64 total_matches = 2; bool truncated = 3; }

message ExceptionInfo { uint64 address = 1; string type = 2; string message = 3; int32 hresult = 4; repeated ExceptionLink inner = 5; }

message ExceptionLink { string type = 1; string message = 2; }

message PrintExceptionRequest { uint64 address = 1; }

message PrintExceptionResponse {
  bool found = 1;
  ExceptionInfo exception = 2;
  repeated StackFrame stack_trace = 3;   // reuses the existing StackFrame message
}
